# Git bağlantısıyla yayın: Netlify bu ayarlarla derler.
# Elle yayın için: `npm run build` → out/ klasörünü Netlify'a sürükleyin.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Önbellek: adı içeriğe göre değişen Next dosyaları 1 yıl; görsel/video/simge 30 gün
# (aynı adla güncellenirse ziyaretçide en geç 30 günde, arka planda yenilenir)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
